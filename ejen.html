<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinjamanKoperasi2U.my - Direktori Ejen & Pautan Rujukan</title>
    <meta name="description" content="Direktori rasmi Ejen Rujukan PinjamanKoperasi2U. Carian kod rujukan ejen dan pautan khas permohonan.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: #334155;
            --accent-gold: #fbbf24;
            --accent-green: #4ade80;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
            --border-radius: 16px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 50px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-badge {
            display: inline-block;
            background: rgba(251, 191, 36, 0.15);
            color: var(--accent-gold);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 15px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .page-header h1 {
            font-size: 2.3rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header p {
            color: var(--text-sub);
            font-size: 1.05rem;
        }

        /* Search & Filter Box */
        .search-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-box i {
            color: var(--accent-gold);
            font-size: 1.2rem;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1.05rem;
        }

        .search-box input::placeholder {
            color: #64748b;
        }

        /* Agents Grid / Table */
        .agents-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .agent-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 22px 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }

        .agent-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        .agent-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .agent-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--accent-gold);
            flex-shrink: 0;
        }

        .agent-details h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .agent-code-badge {
            display: inline-block;
            background: rgba(251, 191, 36, 0.15);
            color: var(--accent-gold);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .agent-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-copy {
            background: #25D366;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-copy:hover {
            background: #1ebe57;
            transform: scale(1.04);
        }

        .btn-visit {
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-visit:hover {
            background: var(--accent-gold);
            color: #0f172a;
            border-color: var(--accent-gold);
        }

        /* Toast notification */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #25D366;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 9999;
        }

        .toast-msg.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 650px) {
            .agent-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .agent-actions {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        
        <!-- Header -->
        <div class="page-header">
            <div class="header-badge"><i class="fas fa-users-gear"></i> Direktori Ejen Berdaftar</div>
            <h1>Senarai Ejen Rujukan & Pautan Khas</h1>
            <p>Pilih atau cari ejen anda untuk dapatkan pautan rujukan khas permohonan pinjaman koperasi.</p>
        </div>

        <!-- Search Box -->
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Cari Nama Ejen atau Kod Rujukan..." oninput="filterAgents()">
        </div>

        <!-- Agents List Container -->
        <div id="agents-container" class="agents-list">
            <div style="text-align: center; color: #94a3b8; padding: 40px;">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 10px;">Memuatkan senarai ejen...</p>
            </div>
        </div>

    </div>

    <!-- Copy Toast Notification -->
    <div id="copy-toast" class="toast-msg">
        <i class="fas fa-check-circle"></i> Pautan rujukan ejen berjaya disalin!
    </div>

    <script>
        const SUPABASE_URL = 'https://oyynssnlnfowcihrjroz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95eW5zc25sbmZvd2NpaHJqcm96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MDY4ODcsImV4cCI6MjEwMjI4Mjg4N30.VmWJAVcdlGG-aq7iSszWMiW-c1B7e5AI5ew4CRkVwFs';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allAgents = [];

        async function fetchAgents() {
            const container = document.getElementById('agents-container');
            try {
                const { data, error } = await supabaseClient
                    .from('affiliates')
                    .select('id, nama, kod_rujukan, created_at, status')
                    .order('id', { ascending: false });

                if (error) throw error;

                allAgents = data || [];
                renderAgents(allAgents);

            } catch (err) {
                console.error('Fetch Agents Error:', err);
                container.innerHTML = `
                    <div style="text-align: center; color: #f87171; padding: 30px; background: rgba(239, 68, 68, 0.1); border-radius: 14px; border: 1px solid rgba(239, 68, 68, 0.3);">
                        <i class="fas fa-exclamation-triangle fa-2x"></i>
                        <p style="margin-top: 10px; font-weight: 600;">Gagal memuatkan senarai ejen. Sila cuba lagi.</p>
                    </div>
                `;
            }
        }

        function renderAgents(agentsList) {
            const container = document.getElementById('agents-container');
            const baseUrl = window.location.origin;

            if (!agentsList || agentsList.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; color: #94a3b8; padding: 40px; background: rgba(30, 41, 59, 0.5); border-radius: 14px; border: 1px solid #334155;">
                        <i class="fas fa-user-slash fa-2x" style="margin-bottom: 10px; color: #64748b;"></i>
                        <p style="font-size: 1.05rem;">Tiada ejen dijumpai.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            agentsList.forEach(agent => {
                const refCode = agent.kod_rujukan || 'EJEN';
                const refUrl = `${baseUrl}/?ref=${encodeURIComponent(refCode)}`;
                const initial = agent.nama ? agent.nama.charAt(0).toUpperCase() : 'E';

                const card = document.createElement('div');
                card.className = 'agent-card';
                card.innerHTML = `
                    <div class="agent-info">
                        <div class="agent-avatar">${initial}</div>
                        <div class="agent-details">
                            <h3>${agent.nama || 'Ejen Berdaftar'}</h3>
                            <span class="agent-code-badge"><i class="fas fa-tag"></i> KOD: ${refCode}</span>
                        </div>
                    </div>
                    <div class="agent-actions">
                        <button class="btn-copy" onclick="copyAgentUrl('${refUrl}')">
                            <i class="fas fa-copy"></i> Salin Link
                        </button>
                        <a href="${refUrl}" class="btn-visit" target="_blank">
                            <i class="fas fa-external-link-alt"></i> Buka Web
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterAgents() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            if (!query) {
                renderAgents(allAgents);
                return;
            }

            const filtered = allAgents.filter(a => 
                (a.nama && a.nama.toLowerCase().includes(query)) ||
                (a.kod_rujukan && a.kod_rujukan.toLowerCase().includes(query))
            );
            renderAgents(filtered);
        }

        function copyAgentUrl(url) {
            navigator.clipboard.writeText(url);
            const toast = document.getElementById('copy-toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Initialize fetch on page load
        fetchAgents();
    </script>
</body>
</html>
